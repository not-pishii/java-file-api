# The largest generated arity of the facts families. The typed layer has no number of its own: it
# reads the ArityFamilies.MAX_ARITY the facts generator writes. Change it here and run
# `:java-file-api-facts:generateArities` then `:java-file-api-typed:generateArities`.
javafile.arity=16
