org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Error Prone and NullAway run inside the compiler, in the daemon: the checks of a module of the typed layer
# need more than the default heap, and the build fails of an out-of-memory error without it.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
# The largest generated arity of the facts families. The typed layer has no number of its own: it
# reads the ArityFamilies.MAX_ARITY the facts generator writes. Change it here and run
# `:java-file-api-facts:generateArities` then `:java-file-api-typed:generateArities`.
javafile.arity=16
